<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pigeon 原型</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="desk">
  <!-- 假的菜单栏和刘海：用来演示刘海上的交互 -->
  <header class="menubar" aria-label="菜单栏（演示）">
    <span class="mb-left"><b>Pigeon</b><span>文件</span><span>显示</span><span>窗口</span></span>
    <div class="hud" id="hud" data-state="idle" role="region" aria-label="刘海面板（演示）">
      <div class="hud-top">
        <span class="ear ear-l" id="ear-l"></span>
        <span class="cam" aria-hidden="true"></span>
        <span class="ear ear-r" id="ear-r"></span>
      </div>
      <div class="hud-body" id="hud-body"></div>
      <div class="hud-glow" id="hud-glow" aria-hidden="true"></div>
    </div>
    <span class="mb-right"><button class="mb-q" id="mb-q" type="button" data-action="mbq" aria-label="Pigeon：等你的事"></button><span>周四 10:42</span></span>
  </header>

  <div class="win">
    <aside class="side">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <nav id="nav" aria-label="页面"></nav>
      <div class="side-foot">
        <button class="ghost setbtn" id="settings" type="button" data-action="settings" aria-label="设置" aria-expanded="false" aria-controls="setpop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>设置</span></button>
        <p>原型 · 全部是示例数据</p>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="setpop" id="setpop" role="dialog" aria-label="设置"></div>
</div>
<script src="art/loft-art.js"></script>
<script src="art/brand.js"></script>
<script src="art/manor.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
