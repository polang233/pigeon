<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pigeon 原型</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="desk">
  <!-- 假的菜单栏和刘海：用来演示刘海上的交互 -->
  <header class="menubar" aria-label="菜单栏（演示）">
    <span class="mb-left"><b>Pigeon</b><span>文件</span><span>显示</span><span>窗口</span></span>
    <div class="hud" id="hud" data-state="idle" role="region" aria-label="刘海面板（演示）">
      <div class="hud-top">
        <span class="ear ear-l" id="ear-l"></span>
        <span class="cam" aria-hidden="true"></span>
        <span class="ear ear-r" id="ear-r"></span>
      </div>
      <div class="hud-body" id="hud-body"></div>
      <div class="hud-glow" id="hud-glow" aria-hidden="true"></div>
    </div>
    <span class="mb-right"><span>周四 10:42</span></span>
  </header>

  <div class="win">
    <aside class="side">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <nav id="nav" aria-label="页面"></nav>
      <div class="side-foot">
        <button class="ghost" id="theme" type="button">切换明暗</button>
        <p>原型 · 全部是示例数据</p>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="art/sprites.js"></script>
<script src="art/loft-art.js"></script>
<script src="app.js"></script>
</body>
</html>
