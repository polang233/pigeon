<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meerkat</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="usage.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="assets/logo.png" alt="" width="34" height="34">
      <div>
        <h1>Meerkat</h1>
        <p>看着你的 agent 们干活</p>
      </div>
    </div>
    <div class="tools">
      <span class="pill" id="mode" data-mode="connecting">连接中…</span>
      <label class="theme">
        <span class="sr">主题</span>
        <select id="theme">
          <option value="studio">立体工作室</option>
          <option value="pixel-studio">像素工作室（经典）</option>
          <option disabled>蚂蚁工坊（即将推出）</option>
          <option disabled>叽里咕噜办公室（即将推出）</option>
        </select>
      </label>
      <button class="btn" id="sim" aria-pressed="false">模拟演示</button>
      <button class="btn" id="usage-open">用量</button>
      <button class="btn" id="open-settings">设置</button>
      <button class="btn primary" id="detect">检测连接</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap">
      <div class="stage" id="stage"></div>
      <div class="seat-switch" id="seat-switch" role="group" aria-label="工位数">
        <span>工位</span>
        <button type="button" data-seats="2" aria-pressed="false">2</button>
        <button type="button" data-seats="3" aria-pressed="true">3</button>
        <button type="button" data-seats="4" aria-pressed="false">4</button>
      </div>
      <div class="hint" id="hint" hidden>
        <p>还没收到 Claude Code 的事件。按 README 接好 hook 后，Claude Code 一派活这里就会动起来。</p>
        <button class="btn" id="hint-sim">先看模拟演示</button>
      </div>
    </section>

    <aside class="log" aria-label="任务列表">
      <div class="waiting" id="waiting" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div class="counts">
        <div><b id="count-running">0</b><span>进行中</span></div>
        <div><b id="count-done">0</b><span>完成</span></div>
        <div><b id="count-failed">0</b><span>出错</span></div>
      </div>
      <ol id="tasks"></ol>
    </aside>
  </main>

  <dialog class="settings" id="settings" aria-labelledby="settings-title">
    <form method="dialog" id="settings-form">
      <header>
        <h2 id="settings-title">设置</h2>
        <button class="btn icon" value="close" aria-label="关闭">✕</button>
      </header>
      <nav class="agent-tabs" role="tablist" aria-label="设置分页">
        <button type="button" role="tab" data-pane="general" class="on" aria-selected="true">通用</button>
        <button type="button" role="tab" data-pane="codex" aria-selected="false">Codex</button>
        <button type="button" role="tab" disabled title="以后加">Claude Code</button>
        <button type="button" role="tab" disabled title="以后加">Cursor</button>
        <button type="button" role="tab" disabled title="以后加">DeepSeek</button>
      </nav>
      <div class="pane" data-pane="general" role="tabpanel">
      <fieldset class="notify-settings">
        <legend>提醒</legend>
        <label class="row"><span>任务完成时通知<small>子代理或 Codex 交回结果时提醒你</small></span><input type="checkbox" name="notifyDone"></label>
        <label class="row"><span>出错时通知</span><input type="checkbox" name="notifyFailed"></label>
        <label class="row"><span>Claude 等你时通知<small>需要你批准工具或回复问题时提醒你</small></span><input type="checkbox" name="notifyWaiting"></label>
        <label class="row"><span>Claude 说完一轮时通知<small>只在这一轮较长时，由 Mac 应用发出通知</small></span><input type="checkbox" name="notifyTurnEnd"></label>
        <label class="row"><span>较长一轮的秒数<small>超过这个时间才提醒，10–3600 秒</small></span><input type="number" name="notifyTurnMinSec" min="10" max="3600" step="1"></label>
      </fieldset>
      <fieldset>
        <legend>场景</legend>
        <div class="row"><span>工位数</span>
          <div class="seg" role="radiogroup" aria-label="工位数">
            <label><input type="radio" name="sceneSeats" value="2">2</label>
            <label><input type="radio" name="sceneSeats" value="3" checked>3</label>
            <label><input type="radio" name="sceneSeats" value="4">4</label>
          </div></div>
        <label class="row"><span>子代理桌旁显示简短任务名</span><input type="checkbox" name="sceneShowSubLabels" checked></label>
        <label class="row"><span>鼠标悬停角色时显示模型和用量卡片</span><input type="checkbox" name="sceneHoverCards" checked></label>
      </fieldset>
      </div>
      <div class="pane" data-pane="codex" role="tabpanel" hidden>

      <fieldset>
        <legend>生图</legend>
        <label class="row"><span>生图优先交给 Codex<small>Claude 遇到生成位图的需求时，交给 Codex 来画</small></span><input type="checkbox" name="preferForImages"></label>
        <label class="row"><span>生图方式<small>内置方式不需要 key；API 方式才能选模型和质量</small></span>
          <select name="imageMode"><option value="builtin">内置 image_gen</option><option value="api">API（需要 OPENAI_API_KEY）</option></select></label>
        <label class="row api-only"><span>图片模型</span><input name="imageModel" placeholder="gpt-image-2"></label>
        <label class="row api-only"><span>图片质量</span>
          <select name="imageQuality"><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label>
        <div class="row"><span>画面比例</span>
          <div class="seg" role="radiogroup" aria-label="画面比例">
            <label><input type="radio" name="imageAspect" value="square">方形</label>
            <label><input type="radio" name="imageAspect" value="landscape">横版</label>
            <label><input type="radio" name="imageAspect" value="portrait">竖版</label>
          </div></div>
        <label class="row"><span>透明背景</span><input type="checkbox" name="imageTransparent"></label>
        <label class="row"><span>保存到项目里的<small>相对项目根目录</small></span><input name="imageDir" placeholder="assets/generated"></label>
      </fieldset>

      <fieldset>
        <legend>对话</legend>
        <label class="row"><span>接收 Codex 自己的事件<small class="save-state" id="codex-hooks-state" role="status">打开设置时读取状态</small></span><input type="checkbox" name="codexHooks" aria-describedby="codex-hooks-state" disabled></label>
        <div class="row"><span>对话记录<small>临时任务不留会话，Codex 应用里看不到；单次任务可以用 --temp / --keep 改</small></span>
          <div class="seg" role="radiogroup" aria-label="对话记录">
            <label><input type="radio" name="sessionMode" value="keep">保留到 Codex</label>
            <label><input type="radio" name="sessionMode" value="temp">临时任务</label>
          </div></div>
        <label class="row"><span>完成后自动打开对话<small>在 Codex 应用里跳到这段对话</small></span><input type="checkbox" name="autoOpen"></label>
        <label class="row"><span>统一走 Meerkat 包装层<small>Claude 直接跑 codex exec 或用 Codex 的 MCP 派活时拦下来，改走包装层，这样都能看到进度、按这里的设置执行</small></span><input type="checkbox" name="routeAll"></label>
      </fieldset>

      <fieldset>
        <legend>运行</legend>
        <label class="row"><span>模型</span><select name="model"><option value="">Codex 默认</option></select></label>
        <label class="row"><span>推理档位</span><select name="effort"><option value="">Codex 默认</option></select></label>
        <label class="row"><span>沙箱<small>自动：审查和其他任务只读，写代码和生图可写工作区</small></span>
          <select name="sandbox"><option value="auto">按任务类型自动</option><option value="read-only">只读</option><option value="workspace-write">可写工作区</option></select></label>
        <label class="row"><span>超时（分钟）</span><input type="number" name="timeoutMin" min="1" max="120"></label>
        <label class="row"><span>同时最多几个任务</span><input type="number" name="maxConcurrent" min="1" max="8"></label>
        <label class="row"><span>结果摘要最长（字）</span><input type="number" name="summaryChars" min="60" max="2000" step="20"></label>
      </fieldset>

      </div>
      <footer>
        <span class="save-state" id="save-state" role="status"></span>
        <button class="btn primary" type="button" id="save-settings">保存</button>
      </footer>
    </form>
  </dialog>

  <dialog class="settings usage" id="usage" aria-labelledby="usage-title">
    <form method="dialog">
      <header>
        <h2 id="usage-title">用量统计</h2>
        <button class="btn icon" value="close" aria-label="关闭">✕</button>
      </header>
      <div class="usage-content">
        <p class="usage-state" id="usage-state" role="status">正在读取用量…</p>
        <div class="usage-cards" id="usage-cards"></div>
      </div>
      <footer><small>数据来自 Claude Code 和 Codex 自己的对话记录，只在本机统计</small></footer>
    </form>
  </dialog>

  <script src="js/sprites.js"></script>
  <script src="js/store.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/theme-pixel.js"></script>
  <script src="js/theme-studio.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/usage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
